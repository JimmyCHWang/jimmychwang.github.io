<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jimmy Wang — Website moved</title>
  <meta name="description" content="Jimmy Wang's personal website has moved to portfolio.jimmychwang.com.">
  <link rel="canonical" href="https://portfolio.jimmychwang.com/">
  <script>
    (function () {
      var base = 'https://portfolio.jimmychwang.com';
      var route = window.location.hash.indexOf('#/') === 0
        ? window.location.hash.slice(1).split('?')[0]
        : window.location.pathname;
      route = route.replace(/\/+$/, '') || '/';
      var destinations = {
        '/projects': '/work/',
        '/academics': '/#education',
        '/achievements': '/interests/',
        '/useful-links': '/#contact'
      };
      window.location.replace(base + (destinations[route] || '/'));
    }());
  </script>
  <meta http-equiv="refresh" content="0; url=https://portfolio.jimmychwang.com/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f6f2; color: #203b31; font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 38rem; padding: 2rem; }
    h1 { font-size: 2rem; line-height: 1.2; }
    a { color: #235c49; text-underline-offset: .2em; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>My website has moved.</h1>
    <p>个人网站已迁移，请访问新作品集。</p>
    <p><a href="https://portfolio.jimmychwang.com/">Continue to portfolio.jimmychwang.com →</a></p>
  </main>
</body>
</html>
